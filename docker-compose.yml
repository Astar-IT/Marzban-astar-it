services:
  marzban:
    build: .
    restart: always
    env_file: .env
    # 3000 не публиковать: панель идёт через Traefik (Ports Exposes = 3000).
    # Эти порты Coolify пробрасывает на хост напрямую, мимо HTTP-прокси.
    ports:
      - "8443:8443"         # VLESS TCP Reality
      - "2053:2053"         # VLESS gRPC Reality
      - "2087:2087"         # VLESS WS TLS
      - "2096:2096"         # VLESS gRPC TLS
      - "2082:2082"         # VMess WS TLS
      - "2086:2086"         # VMess gRPC TLS
      - "2084:2084"         # Trojan WS TLS
      - "2085:2085"         # Trojan gRPC TLS
      - "1080:1080"         # Shadowsocks TCP
      - "1080:1080/udp"     # Shadowsocks UDP
      - "4443:4443/udp"     # Hysteria2
      - "4443:4443/tcp"     # Hysteria2 fallback
      - "18443:18443/udp"   # TUIC
      - "18443:18443/tcp"   # TUIC fallback
      - "23182:23182/udp"   # Juicity
      - "23182:23182/tcp"   # Juicity fallback
    volumes:
      - marzban-data:/var/lib/marzban

volumes:
  marzban-data:
